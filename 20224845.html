<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Quản lý người dùng</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        form {
            border: 1px solid #ccc;
            padding: 15px;
            width: max-content;
            margin-bottom: 20px;
        }

        input,
        button {
            padding: 5px;
            margin: 5px 5px 5px 0;
        }

        .pagination {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h2>Quản lý người dùng </h2>

    <!-- Thanh tìm kiếm -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên...">
    </div>

    <!-- Form thêm người dùng -->
    <form id="addForm">
        <h3>Thêm người dùng</h3>
        <input type="text" id="nameInput" placeholder="Họ và tên" required>
        <input type="email" id="emailInput" placeholder="Email" required>
        <input type="text" id="phoneInput" placeholder="Số điện thoại" required>
        <button type="submit" class="btn-add">Thêm mới</button>
    </form>

    <!-- Bảng hiển thị -->
    <table id="usersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Email</th>
                <th>Số điện thoại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="usersBody">
            <!-- Dữ liệu JS chèn vào -->
        </tbody>
    </table>

    <!-- Phân trang -->
    <div class="pagination">
        <button onclick="prevPage()">Trang trước</button>
        <span id="pageInfo">Trang 1 / 1</span>
        <button onclick="nextPage()">Trang sau</button>
    </div>

    <!-- TOÀN BỘ JAVASCRIPT ĐƯỢC CHÈN CHUNG VÀO ĐÂY -->
    <script>
        const API_URL = 'http://localhost:3000/users';
        let users = [];

        // Các biến để làm phân trang
        let currentPage = 1;
        const rowsPerPage = 5;

        // Khởi chạy khi load trang
        document.addEventListener('DOMContentLoaded', fetchUsers);

        // READ: Lấy danh sách user từ API
        async function fetchUsers() {
            try {
                const response = await fetch(API_URL);
                users = await response.json();
                renderTable();
            } catch (error) {
                console.error('Lỗi khi lấy dữ liệu:', error);
            }
        }

        // Hàm vẽ dữ liệu ra bảng HTML (đã kết hợp logic phân trang)
        function renderTable() {
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = '';

            // 1. Lọc theo tên (Tìm kiếm) trước khi phân trang
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(user =>
                user.name.toLowerCase().includes(keyword)
            );

            // 2. Tính toán phân trang
            const totalPages = Math.ceil(filteredUsers.length / rowsPerPage);

            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
            if (currentPage === 0 && totalPages > 0) currentPage = 1;

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedUsers = filteredUsers.slice(start, end);

            // 3. Vẽ ra bảng
            paginatedUsers.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td><strong>${user.name}</strong></td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>
                        <button class="btn-edit" onclick="editUser(${user.id})">Sửa</button>
                        <button class="btn-delete" onclick="deleteUser(${user.id})">Xóa</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 4. Cập nhật chữ "Trang X / Y"
            document.getElementById('pageInfo').innerText = `Trang ${totalPages === 0 ? 0 : currentPage} / ${totalPages}`;
        }

        // Phân trang: Nút lùi
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        // Phân trang: Nút tiến
        function nextPage() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filteredUsers = users.filter(user => user.name.toLowerCase().includes(keyword));
            const totalPages = Math.ceil(filteredUsers.length / rowsPerPage);

            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        // CREATE: Thêm user mới
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newUser = {
                name: document.getElementById('nameInput').value,
                email: document.getElementById('emailInput').value,
                phone: document.getElementById('phoneInput').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                const createdUser = await response.json();

                if (createdUser.id === 11) {
                    createdUser.id = Math.floor(Math.random() * 1000) + 11;
                }

                users.push(createdUser);
                renderTable();

                document.getElementById('addForm').reset();
                alert('Thêm thành công!');
            } catch (error) {
                console.error('Lỗi thêm dữ liệu:', error);
            }
        });

        // UPDATE: Sửa user
        async function editUser(id) {
            const userToEdit = users.find(u => u.id === id);
            if (!userToEdit) return;

            const newName = prompt('Sửa tên:', userToEdit.name);
            const newEmail = prompt('Sửa email:', userToEdit.email);
            const newPhone = prompt('Sửa số điện thoại:', userToEdit.phone);

            if (newName === null || newEmail === null || newPhone === null) return;

            const updatedData = { name: newName, email: newEmail, phone: newPhone };

            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                users = users.map(user => user.id === id ? { ...user, ...updatedData } : user);
                renderTable();
                alert('Sửa thành công!');
            } catch (error) {
                console.error('Lỗi khi sửa dữ liệu:', error);
            }
        }

        // DELETE: Xóa user
        async function deleteUser(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa?')) return;

            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                users = users.filter(user => user.id !== id);
                renderTable();
                alert('Xóa thành công!');
            } catch (error) {
                console.error('Lỗi khi xóa dữ liệu:', error);
            }
        }

        // SEARCH: Tìm kiếm theo tên
        document.getElementById('searchInput').addEventListener('input', () => {
            currentPage = 1;
            renderTable();
        });
    </script>
</body>

</html>
